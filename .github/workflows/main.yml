name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # Actions дээр гараар "Run workflow" дарж болно

permissions:
  contents: read
  checks: write             # тестийн үр дүнг GitHub-т харуулахад хэрэгтэй

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Бүх сервисийг ажиллуулах
        run: docker compose up -d --build

      - name: Сервисүүд бэлэн болтол хүлээх
        run: |
          for port in 4001 4002 4003 4004 4005 4006 4007 4008 4009; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fs http://localhost:$port/health > /dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then echo "Порт $port бэлэн болсонгүй"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Тест ажиллуулах
        working-directory: qa
        run: |
          npm install
          npm test

      - name: Тестийн үр дүнг харуулах
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: qa/reports/junit.xml
          check_name: API тестийн үр дүн

      - name: Тайлан хадгалах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-junit
          path: qa/reports/junit.xml

      - name: Контейнерийн лог (алдаа гарвал)
        if: failure()
        run: docker compose logs --tail=200
